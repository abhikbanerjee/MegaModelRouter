global:
  scrape_interval: 5s

scrape_configs:
  - job_name: otel-collector            # every routerlab_* metric (gateway -> OTLP -> collector)
    static_configs: [{targets: ["otel-collector:8889"]}]

  - job_name: vllm                      # vLLM's own /metrics (queue depth, KV cache, TTFT); host or containers
    static_configs:
      - targets: ["host.docker.internal:8001", "host.docker.internal:8002",
                  "host.docker.internal:8003", "host.docker.internal:8004"]

  - job_name: dcgm                      # GPU telemetry (profile: gpu)
    static_configs: [{targets: ["dcgm-exporter:9400"]}]
